<svg width="1360" height="520" viewBox="0 0 1360 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ZipList 整体结构示意图</title>
  <desc id="desc">展示 ZipList 的整体结构，包括 zlbytes、zltail、zllen、多个 entry 与 zlend，以及 zltail 偏移量和 zlbytes 总字节数。</desc>
  <style>
    .title { font: 700 28px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #1f2937; }
    .subtitle { font: 500 18px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #4b5563; }
    .header { font: 600 20px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #111827; }
    .small { font: 500 15px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #374151; }
    .stroke { stroke: #2f3b4a; stroke-width: 3; }
    .guide { stroke: #c24141; stroke-width: 4; }
    .thin-guide { stroke: #c24141; stroke-width: 2.5; }
    .box { fill: #ffffff; stroke: #2f3b4a; stroke-width: 3; }
    .panel { fill: #fafafa; stroke: #e5e7eb; stroke-width: 2; rx: 16; }
    .tag { fill: #c24141; rx: 8; }
  </style>

  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c24141"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3b4a"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="1328" height="488" rx="20" fill="#ffffff"/>
  <rect class="panel" x="32" y="32" width="1296" height="456"/>

  <text class="title" x="56" y="72">ZipList 整体结构</text>
  <text class="subtitle" x="56" y="102">连续内存上依次存放元信息、多个 entry，以及末尾的 zlend = 0xFF</text>

  <rect class="box" x="56" y="140" width="180" height="82"/>
  <rect class="box" x="236" y="140" width="180" height="82"/>
  <rect class="box" x="416" y="140" width="150" height="82"/>
  <rect class="box" x="566" y="140" width="170" height="82"/>
  <rect class="box" x="736" y="140" width="170" height="82"/>
  <rect class="box" x="906" y="140" width="120" height="82"/>
  <rect class="box" x="1026" y="140" width="170" height="82"/>
  <rect class="box" x="1196" y="140" width="120" height="82"/>

  <text class="header" x="146" y="190" text-anchor="middle">zlbytes</text>
  <text class="header" x="326" y="190" text-anchor="middle">zltail</text>
  <text class="header" x="491" y="190" text-anchor="middle">zllen</text>
  <text class="header" x="651" y="190" text-anchor="middle">entry</text>
  <text class="header" x="821" y="190" text-anchor="middle">entry</text>
  <text class="header" x="966" y="190" text-anchor="middle">...</text>
  <text class="header" x="1111" y="190" text-anchor="middle">entry</text>
  <text class="header" x="1256" y="190" text-anchor="middle">zlend</text>

  <line class="guide" x1="56" y1="226" x2="56" y2="430"/>
  <line class="guide" x1="1026" y1="226" x2="1026" y2="360"/>
  <line class="guide" x1="1316" y1="226" x2="1316" y2="430"/>

  <line class="thin-guide" x1="56" y1="400" x2="1316" y2="400" marker-end="url(#arrow-red)"/>
  <text class="small" x="680" y="388" text-anchor="middle">zlbytes：整份压缩列表的总字节数</text>
  <rect class="tag" x="56" y="418" width="170" height="54"/>
  <text x="141" y="452" text-anchor="middle" style="font:700 18px 'JetBrains Mono','JetBrains Mono Variable',monospace; fill:#ffffff;">zlbytes 总字节数</text>

  <line class="thin-guide" x1="56" y1="330" x2="1026" y2="330" marker-end="url(#arrow-red)"/>
  <text class="small" x="541" y="318" text-anchor="middle">zltail：从起始地址到尾节点的偏移量</text>
  <rect class="tag" x="220" y="286" width="146" height="58"/>
  <text x="293" y="318" text-anchor="middle" style="font:700 18px 'JetBrains Mono','JetBrains Mono Variable',monospace; fill:#ffffff;">zltail</text>
  <text x="293" y="340" text-anchor="middle" style="font:700 16px 'JetBrains Mono','JetBrains Mono Variable',monospace; fill:#ffffff;">尾偏移量</text>

  <line class="thin-guide" x1="651" y1="262" x2="651" y2="232" marker-end="url(#arrow-dark)"/>
  <text class="small" x="651" y="286" text-anchor="middle">head 节点</text>

  <line class="thin-guide" x1="1111" y1="262" x2="1111" y2="232" marker-end="url(#arrow-dark)"/>
  <text class="small" x="1111" y="286" text-anchor="middle">tail 节点</text>

  <line class="thin-guide" x1="1256" y1="120" x2="1256" y2="92"/>
  <line class="thin-guide" x1="1256" y1="92" x2="1328" y2="92" marker-end="url(#arrow-red)"/>
  <rect class="tag" x="1116" y="64" width="212" height="38"/>
  <text x="1222" y="89" text-anchor="middle" style="font:700 17px 'JetBrains Mono','JetBrains Mono Variable',monospace; fill:#ffffff;">结束标示：0xFF</text>
</svg>
