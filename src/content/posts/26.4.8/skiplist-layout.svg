<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SkipList 结构示意图（优化版）</title>


  <style>
    .title { font: 700 32px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #111827; }
    .subtitle { font: 500 17px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #4b5563; }
    .section { font: 700 22px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #111827; }
    .label { font: 600 17px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #111827; }
    .text { font: 500 16px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #1f2937; }
    .small { font: 500 14px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #475569; }
    .tiny { font: 500 13px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #475569; }
    .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; rx: 18; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 12; }
    .lv3 { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; rx: 10; }
    .lv2 { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; rx: 10; }
    .lv1 { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 2; rx: 10; }
    .note { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; rx: 12; }
    .accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 12; }
    .line { stroke: #334155; stroke-width: 2.5; fill: none; }
    .dash { stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 6; fill: none; }
    .f3 { stroke: #6366f1; stroke-width: 3; fill: none; }
    .f2 { stroke: #2563eb; stroke-width: 3; fill: none; }
    .f1 { stroke: #16a34a; stroke-width: 3; fill: none; }
    .back { stroke: #dc2626; stroke-width: 3; fill: none; }
  </style>

  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-lv3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-lv2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-lv1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="1568" height="868" rx="24" fill="#f8fafc"/>
  <rect class="panel" x="28" y="28" width="1544" height="844"/>

  <text class="title" x="56" y="74">SkipList 结构示意图</text>
  <text class="subtitle" x="56" y="108">优化版：用颜色区分不同层级，用更统一的块结构表达 zskiplist 与 zskiplistNode 的关系</text>

  <rect class="accent" x="56" y="130" width="1488" height="64"/>
  <line class="f3" x1="86" y1="162" x2="146" y2="162" marker-end="url(#arrow-lv3)"/>
  <text class="small" x="160" y="167">Level 3 forward</text>
  <line class="f2" x1="360" y1="162" x2="420" y2="162" marker-end="url(#arrow-lv2)"/>
  <text class="small" x="434" y="167">Level 2 forward</text>
  <line class="f1" x1="634" y1="162" x2="694" y2="162" marker-end="url(#arrow-lv1)"/>
  <text class="small" x="708" y="167">Level 1 forward</text>
  <line class="back" x1="910" y1="162" x2="850" y2="162" marker-end="url(#arrow-back)"/>
  <text class="small" x="928" y="167">backward</text>
  <text class="small" x="1120" y="167">颜色越靠上，层级越高，路径越稀疏</text>

  <rect class="box" x="56" y="240" width="230" height="260"/>
  <text class="section" x="171" y="278" text-anchor="middle">zskiplist</text>
  <line class="line" x1="56" y1="300" x2="286" y2="300"/>
  <line class="line" x1="56" y1="360" x2="286" y2="360"/>
  <line class="line" x1="56" y1="420" x2="286" y2="420"/>
  <text class="label" x="171" y="338" text-anchor="middle">header</text>
  <text class="label" x="171" y="398" text-anchor="middle">tail</text>
  <text class="label" x="171" y="458" text-anchor="middle">length / level</text>



  <g id="nodeA">
    <rect class="box" x="360" y="220" width="180" height="390"/>
    <text class="section" x="450" y="252" text-anchor="middle">Node A</text>
    <rect class="lv3" x="382" y="276" width="136" height="72"/>
    <rect class="lv2" x="382" y="362" width="136" height="72"/>
    <rect class="lv1" x="382" y="448" width="136" height="72"/>
    <text class="tiny" x="450" y="302" text-anchor="middle">Level 3</text>
    <text class="tiny" x="450" y="322" text-anchor="middle">span + forward</text>
    <text class="tiny" x="450" y="388" text-anchor="middle">Level 2</text>
    <text class="tiny" x="450" y="408" text-anchor="middle">span + forward</text>
    <text class="tiny" x="450" y="474" text-anchor="middle">Level 1</text>
    <text class="tiny" x="450" y="494" text-anchor="middle">span + forward</text>
    <line class="line" x1="360" y1="540" x2="540" y2="540"/>
    <text class="text" x="450" y="573" text-anchor="middle">score: 1.0</text>
    <text class="small" x="450" y="598" text-anchor="middle">backward</text>
  </g>

  <g id="nodeB">
    <rect class="box" x="620" y="392" width="180" height="218"/>
    <text class="section" x="710" y="424" text-anchor="middle">Node B</text>
    <rect class="lv1" x="642" y="448" width="136" height="72"/>
    <text class="tiny" x="710" y="474" text-anchor="middle">Level 1</text>
    <text class="tiny" x="710" y="494" text-anchor="middle">span + forward</text>
    <line class="line" x1="620" y1="540" x2="800" y2="540"/>
    <text class="text" x="710" y="573" text-anchor="middle">score: 2.0</text>
    <text class="small" x="710" y="598" text-anchor="middle">backward</text>
  </g>

  <g id="nodeC">
    <rect class="box" x="880" y="306" width="180" height="304"/>
    <text class="section" x="970" y="338" text-anchor="middle">Node C</text>
    <rect class="lv2" x="902" y="362" width="136" height="72"/>
    <rect class="lv1" x="902" y="448" width="136" height="72"/>
    <text class="tiny" x="970" y="388" text-anchor="middle">Level 2</text>
    <text class="tiny" x="970" y="408" text-anchor="middle">span + forward</text>
    <text class="tiny" x="970" y="474" text-anchor="middle">Level 1</text>
    <text class="tiny" x="970" y="494" text-anchor="middle">span + forward</text>
    <line class="line" x1="880" y1="540" x2="1060" y2="540"/>
    <text class="text" x="970" y="573" text-anchor="middle">score: 3.0</text>
    <text class="small" x="970" y="598" text-anchor="middle">backward</text>
  </g>

  <g id="nodeD">
    <rect class="box" x="1140" y="392" width="180" height="218"/>
    <text class="section" x="1230" y="424" text-anchor="middle">Node D</text>
    <rect class="lv1" x="1162" y="448" width="136" height="72"/>
    <text class="tiny" x="1230" y="474" text-anchor="middle">Level 1</text>
    <text class="tiny" x="1230" y="494" text-anchor="middle">span + forward</text>
    <line class="line" x1="1140" y1="540" x2="1320" y2="540"/>
    <text class="text" x="1230" y="573" text-anchor="middle">score: 4.0</text>
    <text class="small" x="1230" y="598" text-anchor="middle">backward</text>
  </g>

  <g id="nodeE">
    <rect class="box" x="1400" y="220" width="144" height="390"/>
    <text class="section" x="1472" y="252" text-anchor="middle">Node E</text>
    <rect class="lv3" x="1416" y="276" width="112" height="72"/>
    <rect class="lv2" x="1416" y="362" width="112" height="72"/>
    <rect class="lv1" x="1416" y="448" width="112" height="72"/>
    <text class="tiny" x="1472" y="302" text-anchor="middle">Level 3</text>
    <text class="tiny" x="1472" y="322" text-anchor="middle">span + forward</text>
    <text class="tiny" x="1472" y="388" text-anchor="middle">Level 2</text>
    <text class="tiny" x="1472" y="408" text-anchor="middle">span + forward</text>
    <text class="tiny" x="1472" y="474" text-anchor="middle">Level 1</text>
    <text class="tiny" x="1472" y="494" text-anchor="middle">span + forward</text>
    <line class="line" x1="1400" y1="540" x2="1544" y2="540"/>
    <text class="text" x="1472" y="573" text-anchor="middle">score: 5.0</text>
    <text class="small" x="1472" y="598" text-anchor="middle">backward</text>
  </g>

  <path class="line" d="M286 330 H330 V560 H360" marker-end="url(#arrow-dark)"/>
  <path class="line" d="M286 390 H320 V710 H1544 V560" marker-end="url(#arrow-dark)"/>
  <text class="small" x="304" y="323">header → 首节点</text>
  <text class="small" x="300" y="734">tail → 尾节点</text>

  <line class="dash" x1="450" y1="312" x2="450" y2="200"/>
  <line class="dash" x1="970" y1="398" x2="970" y2="200"/>
  <line class="dash" x1="1472" y1="312" x2="1472" y2="200"/>
  <text class="small" x="1290" y="214">最高层最稀疏</text>
  <line class="f3" x1="518" y1="312" x2="1416" y2="312" marker-end="url(#arrow-lv3)"/>

  <line class="f2" x1="518" y1="398" x2="902" y2="398" marker-end="url(#arrow-lv2)"/>
  <line class="f2" x1="1038" y1="398" x2="1416" y2="398" marker-end="url(#arrow-lv2)"/>
  <text class="small" x="1110" y="382">中间层缩小查找范围</text>

  <line class="f1" x1="518" y1="484" x2="642" y2="484" marker-end="url(#arrow-lv1)"/>
  <line class="f1" x1="778" y1="484" x2="902" y2="484" marker-end="url(#arrow-lv1)"/>
  <line class="f1" x1="1038" y1="484" x2="1162" y2="484" marker-end="url(#arrow-lv1)"/>
  <line class="f1" x1="1298" y1="484" x2="1416" y2="484" marker-end="url(#arrow-lv1)"/>
  <text class="small" x="1170" y="468">最底层保存完整有序链</text>

  <line class="back" x1="1400" y1="560" x2="1320" y2="560" marker-end="url(#arrow-back)"/>
  <line class="back" x1="1140" y1="560" x2="1060" y2="560" marker-end="url(#arrow-back)"/>
  <line class="back" x1="880" y1="560" x2="800" y2="560" marker-end="url(#arrow-back)"/>
  <line class="back" x1="620" y1="560" x2="540" y2="560" marker-end="url(#arrow-back)"/>


</svg>
