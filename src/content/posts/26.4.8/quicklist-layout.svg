<svg width="1420" height="820" viewBox="0 0 1420 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QuickList 结构示意图</title>
  <desc id="desc">展示 QuickList 的外层结构、两个 quicklistNode 的双向连接，以及节点内部挂载的紧凑块。</desc>
  <style>
    .title { font: 700 30px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #1f2937; }
    .subtitle { font: 500 18px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #4b5563; }
    .header { font: 700 22px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #111827; }
    .text { font: 500 18px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #111827; }
    .small { font: 500 15px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #374151; }
    .tiny { font: 500 14px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #374151; }
    .stroke { stroke: #2f3b4a; stroke-width: 3; }
    .box { fill: #ffffff; stroke: #2f3b4a; stroke-width: 3; }
    .panel { fill: #fafafa; stroke: #e5e7eb; stroke-width: 2; rx: 16; }
    .muted { fill: #f8fafc; }
    .note { fill: #fef2f2; stroke: #c24141; stroke-width: 2; rx: 10; }
  </style>

  <defs>
    <marker id="arrow-q2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3b4a"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="1388" height="788" rx="20" fill="#ffffff"/>
  <rect class="panel" x="32" y="32" width="1356" height="756"/>

  <text class="title" x="56" y="72">QuickList 结构示意图</text>
  <text class="subtitle" x="56" y="104">外层是双向链表，链表节点内部再挂载紧凑存储块；这里仅示意两个 quicklistNode</text>

  <!-- quicklist -->
  <rect class="box" x="44" y="150" width="300" height="360"/>
  <line class="stroke" x1="44" y1="208" x2="344" y2="208"/>
  <line class="stroke" x1="44" y1="266" x2="344" y2="266"/>
  <line class="stroke" x1="44" y1="324" x2="344" y2="324"/>
  <line class="stroke" x1="44" y1="382" x2="344" y2="382"/>
  <line class="stroke" x1="44" y1="440" x2="344" y2="440"/>
  <text class="header" x="194" y="188" text-anchor="middle">QuickList</text>
  <text class="text" x="194" y="244" text-anchor="middle">head</text>
  <text class="text" x="194" y="302" text-anchor="middle">tail</text>
  <text class="text" x="194" y="360" text-anchor="middle">count: 7</text>
  <text class="text" x="194" y="418" text-anchor="middle">len: 2</text>
  <text class="text" x="194" y="476" text-anchor="middle">fill: -2 / compress: 1</text>

  <!-- nodes -->
  <rect class="box" x="500" y="182" width="250" height="236"/>
  <line class="stroke" x1="500" y1="240" x2="750" y2="240"/>
  <line class="stroke" x1="500" y1="286" x2="750" y2="286"/>
  <line class="stroke" x1="500" y1="332" x2="750" y2="332"/>
  <line class="stroke" x1="500" y1="378" x2="750" y2="378"/>
  <text class="header" x="625" y="220" text-anchor="middle">quicklistNode</text>
  <text class="text" x="625" y="270" text-anchor="middle">prev / next</text>
  <text class="text" x="625" y="316" text-anchor="middle">zl</text>
  <text class="text" x="625" y="362" text-anchor="middle">sz: 48</text>
  <text class="text" x="625" y="402" text-anchor="middle">count: 3 / raw</text>

  <rect class="box" x="920" y="182" width="250" height="236"/>
  <line class="stroke" x1="920" y1="240" x2="1170" y2="240"/>
  <line class="stroke" x1="920" y1="286" x2="1170" y2="286"/>
  <line class="stroke" x1="920" y1="332" x2="1170" y2="332"/>
  <line class="stroke" x1="920" y1="378" x2="1170" y2="378"/>
  <text class="header" x="1045" y="220" text-anchor="middle">quicklistNode</text>
  <text class="text" x="1045" y="270" text-anchor="middle">prev / next</text>
  <text class="text" x="1045" y="316" text-anchor="middle">zl</text>
  <text class="text" x="1045" y="362" text-anchor="middle">sz: 52</text>
  <text class="text" x="1045" y="402" text-anchor="middle">count: 4 / raw</text>

  <!-- head/tail arrows -->
  <line class="stroke" x1="344" y1="238" x2="450" y2="238"/>
  <line class="stroke" x1="450" y1="238" x2="450" y2="210"/>
  <line class="stroke" x1="450" y1="210" x2="500" y2="210" marker-end="url(#arrow-q2)"/>

  <line class="stroke" x1="344" y1="296" x2="450" y2="296"/>
  <line class="stroke" x1="450" y1="296" x2="450" y2="170"/>
  <line class="stroke" x1="450" y1="170" x2="920" y2="170"/>
  <line class="stroke" x1="920" y1="170" x2="920" y2="210" marker-end="url(#arrow-q2)"/>

  <!-- prev/next links -->
  <line class="stroke" x1="750" y1="296" x2="920" y2="296" marker-end="url(#arrow-q2)"/>
  <line class="stroke" x1="920" y1="322" x2="750" y2="322" marker-end="url(#arrow-q2)"/>

  <text class="tiny" x="420" y="300">head 指向首节点</text>
  <text class="tiny" x="850" y="160">tail 指向尾节点</text>

  <!-- expanded compact blocks -->
  <rect class="box muted" x="430" y="610" width="140" height="68"/>
  <rect class="box muted" x="570" y="610" width="130" height="68"/>
  <rect class="box muted" x="700" y="610" width="110" height="68"/>
  <rect class="box muted" x="810" y="610" width="120" height="68"/>
  <rect class="box muted" x="930" y="610" width="90" height="68"/>
  <rect class="box muted" x="1020" y="610" width="120" height="68"/>
  <rect class="box muted" x="1140" y="610" width="110" height="68"/>
  <text class="text" x="500" y="651" text-anchor="middle">zlbytes</text>
  <text class="text" x="635" y="651" text-anchor="middle">zltail</text>
  <text class="text" x="755" y="651" text-anchor="middle">zllen</text>
  <text class="text" x="870" y="651" text-anchor="middle">entry</text>
  <text class="text" x="975" y="651" text-anchor="middle">...</text>
  <text class="text" x="1080" y="651" text-anchor="middle">entry</text>
  <text class="text" x="1195" y="651" text-anchor="middle">zlend</text>

  <rect class="box muted" x="830" y="724" width="70" height="50"/>
  <rect class="box muted" x="900" y="724" width="330" height="50"/>
  <text class="text" x="865" y="757" text-anchor="middle">sz</text>
  <text class="tiny" x="1065" y="756" text-anchor="middle">0x31 0x00 0x03 0x61 0x62 0x63 ...</text>

  <line class="stroke" x1="625" y1="332" x2="625" y2="578"/>
  <line class="stroke" x1="625" y1="578" x2="500" y2="578"/>
  <line class="stroke" x1="500" y1="578" x2="500" y2="610" marker-end="url(#arrow-q2)"/>

  <line class="stroke" x1="1045" y1="332" x2="1045" y2="692"/>
  <line class="stroke" x1="1045" y1="692" x2="865" y2="692"/>
  <line class="stroke" x1="865" y1="692" x2="865" y2="724" marker-end="url(#arrow-q2)"/>


</svg>
