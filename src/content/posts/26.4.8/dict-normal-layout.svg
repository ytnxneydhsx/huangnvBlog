<svg width="1640" height="760" viewBox="0 0 1640 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">一般情况下的 Dict 示意图</title>
  <desc id="desc">展示正常情况下 Redis 字典的结构：dict 持有两张哈希表，ht0 承载当前数据，ht1 为空，桶数组中的节点通过 dictEntry 链接。</desc>
  <style>
    .title { font: 700 30px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #1f2937; }
    .subtitle { font: 500 18px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #4b5563; }
    .header { font: 700 24px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #111827; }
    .text { font: 500 18px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #111827; }
    .small { font: 500 16px "JetBrains Mono", "JetBrains Mono Variable", monospace; fill: #374151; }
    .stroke { stroke: #2f3b4a; stroke-width: 3; }
    .box { fill: #ffffff; stroke: #2f3b4a; stroke-width: 3; }
    .panel { fill: #fafafa; stroke: #e5e7eb; stroke-width: 2; rx: 16; }
    .muted { fill: #f8fafc; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3b4a"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="1608" height="728" rx="20" fill="#ffffff"/>
  <rect class="panel" x="32" y="32" width="1576" height="696"/>

  <text class="title" x="60" y="76">一般情况下的 Dict</text>
  <text class="subtitle" x="60" y="108">正常情况下：`ht[0]` 承载当前数据，`ht[1]` 为空，`rehashidx = -1`</text>

  <!-- dict -->
  <rect class="box" x="60" y="160" width="250" height="336"/>
  <line class="stroke" x1="60" y1="214" x2="310" y2="214"/>
  <line class="stroke" x1="60" y1="280" x2="310" y2="280"/>
  <line class="stroke" x1="60" y1="336" x2="310" y2="336"/>
  <line class="stroke" x1="60" y1="392" x2="310" y2="392"/>
  <line class="stroke" x1="60" y1="448" x2="310" y2="448"/>
  <text class="header" x="185" y="196" text-anchor="middle">dict</text>
  <text class="text" x="185" y="252" text-anchor="middle">type: dictType*</text>
  <text class="text" x="185" y="316" text-anchor="middle">privdata: ptr</text>
  <text class="text" x="185" y="372" text-anchor="middle">ht[0], ht[1]</text>
  <text class="text" x="185" y="428" text-anchor="middle">rehashidx: -1</text>
  <text class="text" x="185" y="484" text-anchor="middle">pauserehash: 0</text>

  <!-- hts -->
  <text class="text" x="400" y="214">ht[0]</text>
  <line class="stroke" x1="310" y1="364" x2="380" y2="364"/>
  <line class="stroke" x1="380" y1="364" x2="380" y2="220"/>
  <line class="stroke" x1="380" y1="220" x2="520" y2="220" marker-end="url(#arrow)"/>

  <text class="text" x="400" y="430">ht[1]</text>
  <line class="stroke" x1="310" y1="364" x2="380" y2="364"/>
  <line class="stroke" x1="380" y1="364" x2="380" y2="436"/>
  <line class="stroke" x1="380" y1="436" x2="520" y2="436" marker-end="url(#arrow)"/>

  <rect class="box" x="520" y="140" width="290" height="230"/>
  <line class="stroke" x1="520" y1="194" x2="810" y2="194"/>
  <line class="stroke" x1="520" y1="244" x2="810" y2="244"/>
  <line class="stroke" x1="520" y1="294" x2="810" y2="294"/>
  <line class="stroke" x1="520" y1="344" x2="810" y2="344"/>
  <text class="header" x="665" y="176" text-anchor="middle">dictht</text>
  <text class="text" x="665" y="228" text-anchor="middle">table: dictEntry**</text>
  <text class="text" x="665" y="278" text-anchor="middle">size: 4</text>
  <text class="text" x="665" y="328" text-anchor="middle">sizemask: 3</text>
  <text class="text" x="665" y="362" text-anchor="middle">used: 2</text>

  <rect class="box" x="520" y="396" width="290" height="230"/>
  <line class="stroke" x1="520" y1="450" x2="810" y2="450"/>
  <line class="stroke" x1="520" y1="500" x2="810" y2="500"/>
  <line class="stroke" x1="520" y1="550" x2="810" y2="550"/>
  <line class="stroke" x1="520" y1="600" x2="810" y2="600"/>
  <text class="header" x="665" y="432" text-anchor="middle">dictht</text>
  <text class="text" x="665" y="484" text-anchor="middle">table: null</text>
  <text class="text" x="665" y="534" text-anchor="middle">size: 0</text>
  <text class="text" x="665" y="584" text-anchor="middle">sizemask: 0</text>
  <text class="text" x="665" y="618" text-anchor="middle">used: 0</text>

  <!-- bucket array -->
  <rect class="box" x="960" y="128" width="260" height="260"/>
  <line class="stroke" x1="960" y1="182" x2="1220" y2="182"/>
  <line class="stroke" x1="960" y1="234" x2="1220" y2="234"/>
  <line class="stroke" x1="960" y1="286" x2="1220" y2="286"/>
  <line class="stroke" x1="960" y1="338" x2="1220" y2="338"/>
  <text class="header" x="1090" y="165" text-anchor="middle">bucket table</text>
  <text class="text" x="1090" y="218" text-anchor="middle">bucket 0: null</text>
  <text class="text" x="1090" y="270" text-anchor="middle">bucket 1: entry A</text>
  <text class="text" x="1090" y="322" text-anchor="middle">bucket 2: null</text>
  <text class="text" x="1090" y="374" text-anchor="middle">bucket 3: entry B</text>

  <line class="stroke" x1="810" y1="220" x2="930" y2="220"/>
  <line class="stroke" x1="930" y1="220" x2="930" y2="170"/>
  <line class="stroke" x1="930" y1="170" x2="960" y2="170" marker-end="url(#arrow)"/>

  <!-- ht1 null -->
  <rect class="box muted" x="980" y="478" width="220" height="70"/>
  <text class="header" x="1090" y="523" text-anchor="middle">null</text>
  <line class="stroke" x1="810" y1="436" x2="930" y2="436"/>
  <line class="stroke" x1="930" y1="436" x2="930" y2="513"/>
  <line class="stroke" x1="930" y1="513" x2="980" y2="513" marker-end="url(#arrow)"/>

  <!-- entries -->
  <rect class="box" x="1360" y="120" width="220" height="186"/>
  <line class="stroke" x1="1360" y1="174" x2="1580" y2="174"/>
  <line class="stroke" x1="1360" y1="224" x2="1580" y2="224"/>
  <line class="stroke" x1="1360" y1="274" x2="1580" y2="274"/>
  <text class="header" x="1470" y="156" text-anchor="middle">dictEntry</text>
  <text class="text" x="1470" y="206" text-anchor="middle">key: user:1</text>
  <text class="text" x="1470" y="256" text-anchor="middle">val: value A</text>
  <text class="text" x="1470" y="292" text-anchor="middle">next: null</text>

  <rect class="box" x="1360" y="340" width="220" height="186"/>
  <line class="stroke" x1="1360" y1="394" x2="1580" y2="394"/>
  <line class="stroke" x1="1360" y1="444" x2="1580" y2="444"/>
  <line class="stroke" x1="1360" y1="494" x2="1580" y2="494"/>
  <text class="header" x="1470" y="376" text-anchor="middle">dictEntry</text>
  <text class="text" x="1470" y="426" text-anchor="middle">key: user:9</text>
  <text class="text" x="1470" y="476" text-anchor="middle">val: value B</text>
  <text class="text" x="1470" y="512" text-anchor="middle">next: null</text>

  <line class="stroke" x1="1220" y1="260" x2="1300" y2="260"/>
  <line class="stroke" x1="1300" y1="260" x2="1300" y2="156"/>
  <line class="stroke" x1="1300" y1="156" x2="1360" y2="156" marker-end="url(#arrow)"/>

  <line class="stroke" x1="1220" y1="364" x2="1300" y2="364"/>
  <line class="stroke" x1="1300" y1="364" x2="1300" y2="376"/>
  <line class="stroke" x1="1300" y1="376" x2="1360" y2="376" marker-end="url(#arrow)"/>

  <text class="small" x="960" y="420">正常情况下，只有 `ht[0]` 挂载节点；`ht[1]` 仍然为空。</text>
  <text class="small" x="1360" y="560">如果发生哈希冲突，同一 bucket 中的多个节点会通过 `next` 串成链表。</text>
</svg>
